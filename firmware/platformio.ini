[platformio]
default_envs = pcbot-esp32-s3-n4r2
boards_dir = ../boards

[env:pcbot-esp32-s3-n4r2]
platform = espressif32
board = pcbot-esp32-s3-n4r2
framework = arduino
monitor_speed = 115200
; Two app slots so firmware can be replaced over Wi-Fi without losing the
; running image if the transfer fails.
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=1
  -D USE_HSPI_PORT=1
  -D USER_SETUP_LOADED=1
  -D ILI9341_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=11
  -D TFT_SCLK=12
  -D TFT_CS=10
  -D TFT_DC=7
  -D TFT_RST=6
  -D TFT_MISO=13
  -D TOUCH_CS=-1
  ; 10 MHz limited a full panel refresh to ~8 FPS, which is what made the UI
  ; feel sluggish. 40 MHz is the ILI9341 sweet spot for short display wiring.
  -D SPI_FREQUENCY=40000000
  -D SPI_READ_FREQUENCY=20000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  ; Font 7 is the 48 px seven-segment face used by the power-saver clock.
  -D LOAD_FONT7=1
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.4.1
  256dpi/MQTT@^2.5.2
  h2zero/NimBLE-Arduino@^2.3.6
